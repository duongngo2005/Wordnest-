name: wordnest-local-ai

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  kokoro:
    image: ghcr.io/openttsgroup/kokoro-open-tts:latest
    restart: unless-stopped
    environment:
      KOKORO_DEVICE: ${KOKORO_DEVICE:-cpu}
      KOKORO_PRELOAD_LANGS: a,b
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kokoro-cache:/root/.cache

volumes:
  ollama-models:
  kokoro-cache:
