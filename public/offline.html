<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Không kết nối được WordNest</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: #FAF6EE;
        color: #221C16;
        font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 30rem); border: 2px solid #221C16; border-radius: 1.25rem; background: #FFFDF9; padding: 1.5rem; box-shadow: 4px 4px 0 #221C16; }
      h1 { margin: 0; font-size: 1.25rem; line-height: 1.25; }
      p { margin: .75rem 0 0; color: #6B6258; font-size: 1rem; line-height: 1.55; }
      button { min-height: 2.75rem; margin-top: 1.25rem; border: 2px solid #221C16; border-radius: .875rem; background: #E06B43; color: #fff; padding: .625rem 1rem; font: inherit; font-weight: 800; box-shadow: 2px 2px 0 #221C16; }
      button:focus-visible { outline: 2px solid #E06B43; outline-offset: 3px; }
      button:active { transform: translate(2px, 2px); box-shadow: none; }
    </style>
  </head>
  <body>
    <main role="alert">
      <h1>Không kết nối được WordNest Server.</h1>
      <p>Kiểm tra mạng hoặc kết nối Tailscale rồi thử lại.</p>
      <button type="button" onclick="window.location.reload()">Thử lại</button>
    </main>
  </body>
</html>
